<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>EmoBot Control Panel</title>
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    body {
      background-color: #0f172a;
      color: #00ffff;
      font-family: "Poppins", sans-serif;
      text-align: center;
      margin-top: 100px;
    }
    h1 {
      color: #00ffff;
      font-size: 2.5rem;
    }
    input, button {
      font-size: 1.3rem;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      outline: none;
    }
    input {
      width: 250px;
      margin-right: 10px;
    }
    button {
      background-color: #00ffff;
      color: #0f172a;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      background-color: #06b6d4;
    }
    #status {
      margin-top: 20px;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <h1>🎭 EmoBot Command Center</h1>
  <p>Type an emotion (happy / angry / tired / default)</p>

  <input id="emotionInput" type="text" placeholder="Enter emotion..." />
  <button onclick="sendEmotion()">Send</button>

  <div id="status">Connecting to MQTT...</div>

  <script>
    const broker = 'ws://13.232.191.178:8083'; // WebSocket URL
    const topic = 'emobot/screen/command';

    // Connect to broker
    const client = mqtt.connect(broker);

    const statusDiv = document.getElementById('status');
    const inputBox = document.getElementById('emotionInput');

    client.on('connect', () => {
      console.log('✅ Connected to MQTT broker');
      statusDiv.innerText = 'Connected to MQTT broker ✅';
    });

    client.on('error', (err) => {
      console.error('❌ Connection error:', err);
      statusDiv.innerText = 'Error connecting to MQTT server ❌';
    });

    function sendEmotion() {
      const msg = inputBox.value.trim().toLowerCase();
      if (!msg) {
        alert('Please enter an emotion.');
        return;
      }
      client.publish(topic, msg);
      console.log(`📤 Sent: ${msg}`);
      statusDiv.innerText = `Sent "${msg}" to ${topic}`;
      inputBox.value = '';
    }
  </script>
</body>
</html>
